# Prometheus scrape config — TraderWise.
# Per IMPLEMENTATION_PLAN.md §3.10 Op1.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: api
    static_configs:
      - targets: [api:8000]
    metrics_path: /metrics
