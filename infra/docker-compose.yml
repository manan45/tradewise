# TraderWise local stack.
# Per IMPLEMENTATION_PLAN.md §3.1 (D1-D3) + §3.10 Op4.
# Memory caps tuned for MacBook M3 Pro 18GB (LOCAL_DEV.md §4).
# Bus standardized on RabbitMQ; Kafka/Zookeeper removed.

services:

  # ---------- Storage ----------
  db:
    image: timescale/timescaledb-ha:pg16
    hostname: postgres-db
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: "${DB_USER:-traderwise}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-traderwise}"
      POSTGRES_DB: "${DB_NAME:-traderwise}"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=512MB"
      - "-c"
      - "effective_cache_size=1GB"
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traderwise}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G

  redis:
    image: redis:7-alpine
    hostname: redis
    ports: ["6379:6379"]
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks: [app-network]
    deploy:
      resources:
        limits:
          memory: 384M

  qdrant:
    image: qdrant/qdrant:latest
    hostname: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [app-network]
    deploy:
      resources:
        limits:
          memory: 1G

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"   # management UI
    environment:
      RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER:-traderwise}"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:-traderwise}"
    networks: [app-network]
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    ports: ["9090:9090"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [app-network]
    deploy:
      resources:
        limits:
          memory: 512M

  grafana:
    image: grafana/grafana-oss:latest
    hostname: grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - grafana_data:/var/lib/grafana
    networks: [app-network]
    deploy:
      resources:
        limits:
          memory: 256M

  # ---------- Application ----------
  api:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
      rabbitmq: { condition: service_started }
    env_file: [../.env]
    environment:
      - DB_HOST=postgres-db
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - QDRANT_HOST=qdrant
    networks: [app-network]

volumes:
  postgres_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  app-network:
    driver: bridge
